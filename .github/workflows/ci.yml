name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - run: npm ci --prefix cms-auth-worker
      - run: npm run check --prefix cms-auth-worker
      - run: npm test --prefix cms-auth-worker
